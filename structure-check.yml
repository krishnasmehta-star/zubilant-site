name: Structure check

# Runs on every push and pull request. If a card, tab panel or rail is
# malformed, this fails with a red X and GitHub emails the committer —
# before anyone has to find it by clicking a tab on the live site.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install html5lib
      - name: Check page structure
        run: python3 tools/check-structure.py
